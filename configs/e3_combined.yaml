# E3: Combined training (LongMemEval + Custom Dataset)
experiment_id: "E3"
description: "LongMemEval training with Custom Dataset added to train split"
seed: 42
dataset: "combined"
model_name_or_path: "distilbert-base-uncased"
context_window: 1
max_length: 256
batch_size: 16
epochs: 3
lr: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.10
grad_clip: 1.0
patience: 2
aux_weight: 0.0
max_train_turns: 3000
output_dir: "results/e3_combined"

