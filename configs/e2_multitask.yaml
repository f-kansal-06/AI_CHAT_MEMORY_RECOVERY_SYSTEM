# E2: Multi-task DistilBERT (importance head + auxiliary category head with weight 0.3)
experiment_id: "E2"
description: "E1 + auxiliary category classification head (aux_weight 0.3)"
seed: 42
dataset: "longmemeval"
model_name_or_path: "distilbert-base-uncased"
context_window: 1
max_length: 256
batch_size: 16
epochs: 3
lr: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.10
grad_clip: 1.0
patience: 2
aux_weight: 0.3
max_train_turns: 2000
output_dir: "results/e2_multitask"

