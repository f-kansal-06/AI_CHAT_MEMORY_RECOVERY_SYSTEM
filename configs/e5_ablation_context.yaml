# E5: Context window ablation: 0, 1, 2 previous turns
experiment_id: "E5"
description: "Context window ablation (0, 1, 2 previous turns)"
seed: 42
dataset: "longmemeval"
windows: [0, 1, 2]
model_name_or_path: "distilbert-base-uncased"
max_length: 256
batch_size: 16
epochs: 3
lr: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.10
grad_clip: 1.0
patience: 2
aux_weight: 0.0
max_train_turns: 2000
output_dir: "results/e5_ablation_context"

